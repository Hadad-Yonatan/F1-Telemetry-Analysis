name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install '.[library]'
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Check installed dependencies
        run: python -m pip check

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and browser test tooling
        run: python -m pip install '.[browser-test,library]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest discover -s browser_tests -p 'test_*.py'
