[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-analysis"
version = "0.1.0"
description = "Capture and analyze F1 25 UDP telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "f1-packets==2025.1.1",
]

[project.scripts]
f1-telemetry-probe = "f1_telemetry.probe:main"
f1-telemetry-capture = "f1_telemetry.capture:main"
f1-telemetry-replay = "f1_telemetry.replay:main"

[tool.setuptools.packages.find]
where = ["src"]
